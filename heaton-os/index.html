<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FAF6EE'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%231C1814' stroke-width='3'/%3E%3Cpath d='M10 9v14M22 9v14M10 16h12' stroke='%231C1814' stroke-width='4'/%3E%3C/svg%3E"
    />
    <title>Heaton OS</title>
    <!--
      Applied before first paint, ahead of the module bundle, so the stored
      theme takes effect with no flash of the wrong theme on load. Mirrors
      src/store/theme.ts — keep the two in sync if the storage key changes.
    -->
    <script>
      (function () {
        var KEY = "heaton-os.theme.v1";
        var pref = "system";
        try {
          var raw = localStorage.getItem(KEY);
          if (raw === "light" || raw === "dark" || raw === "system") pref = raw;
        } catch (e) {
          /* storage unavailable — fall back to system */
        }
        var root = document.documentElement;
        if (pref === "system") {
          root.style.colorScheme = "light dark";
        } else {
          root.dataset.theme = pref;
          root.style.colorScheme = pref;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
